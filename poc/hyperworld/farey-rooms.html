<title>Farey Rooms</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE everyday: a walkable toy with an engineer's dashboard
   IDEA a museum of rooms on the hyperbolic plane, each room's address an exact integer matrix
   PICTURE the 3D walk itself, full screen; the HUD is a datasheet card in the corner
   COLOUR dusk ground #1b1e3a, ink #f4f1ea, room pastels by address, accent #ffcf4a for exact, #ff5a6e for naive failure
   TYPE Space Grotesk + Inter
   LAYOUT canvas fills the screen; HUD top-left (laptop), collapsible strip at top (phone); touch pads bottom */
:root{color-scheme:dark;--bg:#1b1e3a;--ink:#f4f1ea;--muted:#b9b6c9;--panel:rgba(18,20,42,.86);--edge:rgba(255,255,255,.14);--gold:#ffcf4a;--red:#ff5a6e}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif;overflow:hidden}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));width:min(330px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:14px 16px;backdrop-filter:blur(6px)}
.hud h1{font:600 22px/1.05 'Space Grotesk',system-ui,sans-serif;letter-spacing:-.02em;margin:0 0 4px}
.hud p{margin:0 0 10px;color:var(--muted);font-size:13px}
.row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-top:1px solid var(--edge)}
.row b{font-weight:500;color:var(--muted)}
.row span{font-variant-numeric:tabular-nums;text-align:right;overflow-wrap:anywhere}
#addr{font-size:12px;color:var(--gold)}
#err.bad{color:var(--red)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
button{font:500 13px Inter,system-ui,sans-serif;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--edge);border-radius:8px;padding:9px 11px;min-height:40px;cursor:pointer}
button:hover{background:rgba(255,255,255,.16)}
button.on{background:var(--red);border-color:var(--red);color:#1b1e3a}
#vr{background:var(--gold);color:#1b1e3a;border-color:var(--gold)}
.keys{margin-top:8px;color:var(--muted);font-size:12px}
#msg{margin-top:6px;font-size:12px;color:var(--muted)}
.pad{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;border:1px solid var(--edge);background:rgba(18,20,42,.45);display:none}
#padL{left:max(18px,env(safe-area-inset-left,0px))}
#padR{right:max(18px,env(safe-area-inset-right,0px))}
@media (hover:none){.pad{display:block}.keys{display:none}}
@media (max-width:600px){.hud{padding:10px 12px}.hud h1{font-size:19px}.hud p{display:none}}
</style>

<canvas id="view"></canvas>
<div class="hud">
  <h1>Farey Rooms</h1>
  <p>Every room is a tile of the hyperbolic plane. Its address is an exact integer matrix, so nothing drifts however far you walk.</p>
  <div class="row"><b>Room address</b><span id="addr">0/1 | 1/1 | inf</span></div>
  <div class="row"><b>Doorways crossed</b><span id="cross">0</span></div>
  <div class="row"><b>Matrix size</b><span id="digits">1 digit</span></div>
  <div class="row"><b>Float-engine error</b><span id="err">0</span></div>
  <div class="btns">
    <button id="naive" type="button">Show float engine</button>
    <button id="far" type="button">Jump 5 rooms out</button>
    <button id="reset" type="button">Reset</button>
    <button id="vr" type="button">Enter VR</button>
  </div>
  <div class="keys">WASD or arrows to walk, Q/E or drag to turn.</div>
  <div id="msg"></div>
</div>
<div class="pad" id="padL"></div><div class="pad" id="padR"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
{
// ---------- exact core (PSL(2,Z), Farey tessellation) ----------
const GEN = {T:[[1n,1n],[0n,1n]], Tinv:[[1n,-1n],[0n,1n]], Q:[[1n,0n],[1n,1n]], Qinv:[[1n,0n],[-1n,1n]]};
const INV = {T:'Tinv', Tinv:'T', Q:'Qinv'};
const I2 = [[1n,0n],[0n,1n]];
const mul = (A,B) => [[A[0][0]*B[0][0]+A[0][1]*B[1][0], A[0][0]*B[0][1]+A[0][1]*B[1][1]], [A[1][0]*B[0][0]+A[1][1]*B[1][0], A[1][0]*B[0][1]+A[1][1]*B[1][1]]];
const inv = A => [[A[1][1],-A[0][1]],[-A[1][0],A[0][0]]];
const toF = A => A.map(r => r.map(Number));
const fmul = (A,B) => [[A[0][0]*B[0][0]+A[0][1]*B[1][0], A[0][0]*B[0][1]+A[0][1]*B[1][1]], [A[1][0]*B[0][0]+A[1][1]*B[1][0], A[1][0]*B[0][1]+A[1][1]*B[1][1]]];
const finv = A => { const d = A[0][0]*A[1][1]-A[0][1]*A[1][0]; return [[A[1][1]/d,-A[0][1]/d],[-A[1][0]/d,A[0][0]/d]]; };
const norm = g => { const d = Math.sqrt(Math.abs(g[0][0]*g[1][1]-g[0][1]*g[1][0])); return g.map(r => r.map(v => v/d)); };
const mob = (A,x,y) => { const nr = A[0][0]*x+A[0][1], ni = A[0][0]*y, dr = A[1][0]*x+A[1][1], di = A[1][0]*y, d = dr*dr+di*di; return [(nr*dr+ni*di)/d, (ni*dr-nr*di)/d]; };
const gcd = (a,b) => { a = a<0n?-a:a; b = b<0n?-b:b; while (b) [a,b] = [b,a%b]; return a; };
const frac = (p,q) => { if (q===0n) return 'inf'; if (q<0n){p=-p;q=-q;} const g = gcd(p,q); return `${p/g}/${q/g}`; };
const key = M => [frac(M[0][1],M[1][1]), frac(M[0][0]+M[0][1],M[1][0]+M[1][1]), frac(M[0][0],M[1][0])].sort().join(' | ');
const C0 = [0.5, Math.sqrt(3)/2], HINF = 2, RC = 0.25;
const exitGen = (x,y) => x < 0 ? 'Tinv' : x > 1 ? 'T' : ((x-.5)**2+y*y < .25 ? 'Q' : null);
const wall = (x,y) => y > HINF || x*x+(y-RC)**2 < RC*RC || (x-1)**2+(y-RC)**2 < RC*RC;
const K = t => [[Math.cos(t/2),Math.sin(t/2)],[-Math.sin(t/2),Math.cos(t/2)]];
const A = s => [[Math.exp(s/2),0],[0,Math.exp(-s/2)]];
const g0 = () => { const a = Math.sqrt(C0[1]); return [[a, C0[0]/a],[0,1/a]]; };
const start = () => { let g = norm(fmul(g0(), K(Math.PI))); g = norm(fmul(fmul(fmul(g, K(-1.2)), A(0.28)), K(1.2))); return g; };
const W = {M:I2, g:start(), cross:0, out:0};
function move(s, al){
  for (let k = 0; k < 3; k++) {      // slide along walls: try the direction, then two side-steps
    const a = al + [0, 0.6, -0.6][k], g2 = norm(fmul(fmul(fmul(W.g,K(a)),A(s)),K(-a))), [x,y] = mob(g2,0,1);
    if (wall(x,y)) continue;
    W.g = g2;
    for (let i = 0; i < 4; i++) { const p = mob(W.g,0,1), e = exitGen(p[0],p[1]); if (!e) break; W.M = mul(W.M,GEN[e]); W.g = norm(fmul(toF(GEN[INV[e]]),W.g)); W.cross++; }
    return;
  }
}
const turn = t => { W.g = norm(fmul(W.g, K(t))); };

// ---------- base tile mesh in the tile frame (upper half-plane) ----------
const bnd = [], wallIdx = [], doorIdx = [], N = 14;
const seg = (f, kind) => { for (let i = 0; i < N; i++) { bnd.push(f(i/N)); (kind ? wallIdx : doorIdx).push(bnd.length-1); } };
seg(t => [1-t, HINF], 1);                                                     // horocycle at inf
seg(t => [0, HINF*Math.pow(0.25, t)], 0);                                     // doorway x = 0 (y from 2 to 1/2)
seg(t => { const a0 = Math.PI/2, a1 = Math.atan2(0.4-RC, 0.2), a = a0+(a1-a0)*t; return [RC*Math.cos(a), RC+RC*Math.sin(a)]; }, 1);
seg(t => { const a0 = Math.atan2(0.4, 0.2-0.5), a1 = Math.atan2(0.4, 0.8-0.5), a = a0+(a1-a0)*t; return [0.5+0.5*Math.cos(a), 0.5*Math.sin(a)]; }, 0);
seg(t => { const a0 = Math.atan2(0.4-RC, -0.2), a1 = Math.PI/2, a = a0+(a1-a0)*t; return [1+RC*Math.cos(a), RC+RC*Math.sin(a)]; }, 1);
seg(t => [1, 0.5*Math.pow(4, t)], 0);                                         // doorway x = 1 (y from 1/2 to 2)
const RINGS = 6, cplx = { c:C0 };
const toDisk = (x,y) => { const nr = x-C0[0], ni = y-C0[1], dr = x-C0[0], di = y+C0[1], d = dr*dr+di*di; return [(nr*dr+ni*di)/d, (ni*dr-nr*di)/d]; };
const fromDisk = (u,v) => { const nr = C0[0]-C0[0]*u-C0[1]*v, ni = C0[1]+C0[1]*u-C0[0]*v, dr = 1-u, di = -v, d = dr*dr+di*di; return [(nr*dr+ni*di)/d, (ni*dr-nr*di)/d]; };
const pts = [C0];
for (const b of bnd) { const [u,v] = toDisk(b[0],b[1]); for (let r = 1; r <= RINGS; r++) pts.push(fromDisk(u*r/RINGS, v*r/RINGS)); }
const tris = [], NB = bnd.length;
for (let j = 0; j < NB; j++) { const a = j, b = (j+1)%NB, at = r => r === 0 ? 0 : 1+a*RINGS+(r-1), bt = r => r === 0 ? 0 : 1+b*RINGS+(r-1);
  tris.push(0, at(1), bt(1)); for (let r = 1; r < RINGS; r++) tris.push(at(r), at(r+1), bt(r+1), at(r), bt(r+1), bt(r)); }
const rim = j => 1+j*RINGS+RINGS-1;

// ---------- three.js scene ----------
const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.xr.enabled = true;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#1b1e3a'); scene.fog = new THREE.Fog('#1b1e3a', 6, 26);
const cam = new THREE.PerspectiveCamera(72, 1, 0.05, 60); cam.position.set(0, 1.6, 0);
const rig = new THREE.Group(); rig.add(cam); scene.add(rig);
scene.add(new THREE.HemisphereLight('#fff4dc', '#2a2950', 1.0));
const MAXT = 120, S = 2.4;                                   // tiles drawn, metres per hyperbolic unit
const mk = (n, idx) => { const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n*3),3)); geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(n*3),3)); if (idx) geo.setIndex(idx); return geo; };
const floorIdx = []; for (let t = 0; t < MAXT; t++) for (const i of tris) floorIdx.push(t*pts.length+i);
const floorGeo = mk(MAXT*pts.length, floorIdx);
scene.add(new THREE.Mesh(floorGeo, new THREE.MeshLambertMaterial({vertexColors:true, side:THREE.DoubleSide})));
const WS = wallIdx.length, wallTri = [];
for (let t = 0; t < MAXT; t++) for (let k = 0; k < WS; k++) { const j = wallIdx[k]; if (!wallIdx.includes((j+1)%NB)) continue; const a = t*WS*2+k*2, b = t*WS*2+wallIdx.indexOf((j+1)%NB)*2; wallTri.push(a, b, b+1, a, b+1, a+1); }
const wallGeo = mk(MAXT*WS*2, wallTri);
scene.add(new THREE.Mesh(wallGeo, new THREE.MeshLambertMaterial({vertexColors:true, side:THREE.DoubleSide})));
const DS = doorIdx.length, doorGeo = mk(MAXT*DS*2);
scene.add(new THREE.LineSegments(doorGeo, new THREE.LineBasicMaterial({vertexColors:true})));
const pillarGeo = new THREE.CylinderGeometry(0.12, 0.18, 1.2, 10); pillarGeo.translate(0, 0.6, 0);
const pillars = new THREE.InstancedMesh(pillarGeo, new THREE.MeshLambertMaterial(), MAXT); scene.add(pillars);
const hashCol = k => { let h = 2166136261; for (const ch of k) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return new THREE.Color().setHSL(((h>>>0)%360)/360, 0.55, 0.62); };

// ---------- visible tiles (exact relative transforms, cached per room) ----------
let naive = false, vis = [], visKey = '', lastErr = 0;
function refreshVisible(){
  const k = key(W.M) + (naive ? 'n' : ''); if (k === visKey) return; visKey = k;
  vis = []; const seen = new Set([key(W.M)]), q = [{rel:I2, d:0}], Mf = toF(W.M), Mfi = finv(Mf); lastErr = 0;
  while (q.length && vis.length < MAXT) {
    const {rel, d} = q.shift(), Nabs = mul(W.M, rel), exact = toF(rel), flt = fmul(Mfi, toF(Nabs));
    const e = Math.max(...[0,1].flatMap(i => [0,1].map(j => Math.abs(flt[i][j]-exact[i][j])))); lastErr = Math.max(lastErr, isFinite(e) ? e : Infinity);
    vis.push({F: naive ? flt : exact, col: hashCol(key(Nabs)), d});
    if (d < 5) for (const e2 of ['T','Tinv','Q']) { const r2 = mul(rel, GEN[e2]), k2 = key(mul(W.M, r2)); if (!seen.has(k2)) { seen.add(k2); q.push({rel:r2, d:d+1}); } }
  }
}
const place = (H, x, y, out) => {        // tile-frame point -> player-centred equidistant 3D
  const w = mob(H, x, y), nr = w[0], ni = w[1]-1, dr = w[0], di = w[1]+1, dd = dr*dr+di*di, u = (nr*dr+ni*di)/dd, v = (ni*dr-nr*di)/dd;
  const r = Math.min(Math.hypot(u,v), 0.9999999), d = 2*Math.atanh(r), th = Math.atan2(v,u);
  out[0] = -d*Math.sin(th)*S; out[1] = -d*Math.cos(th)*S;
  if (!isFinite(out[0]) || !isFinite(out[1])) { out[0] = 0; out[1] = 0; return -1; }   // degenerate (float engine only): hide
  return d;
};
const tmp = [0,0], M4 = new THREE.Matrix4();
function rebuild(){
  refreshVisible(); const gi = finv(W.g);
  const fp = floorGeo.attributes.position.array, fc = floorGeo.attributes.color.array, wp = wallGeo.attributes.position.array, wc = wallGeo.attributes.color.array, dp = doorGeo.attributes.position.array, dc = doorGeo.attributes.color.array;
  fp.fill(0); wp.fill(0); dp.fill(0);
  vis.forEach((t, ti) => {
    const H = fmul(gi, t.F); if (!H.flat().every(isFinite)) return;
    const shade = t.d % 2 ? 0.86 : 1;
    pts.forEach((p, i) => { const ok = place(H, p[0], p[1], tmp) >= 0; const o = (ti*pts.length+i)*3; fp[o] = tmp[0]; fp[o+1] = ok ? 0 : -50; fp[o+2] = tmp[1]; fc[o] = t.col.r*shade; fc[o+1] = t.col.g*shade; fc[o+2] = t.col.b*shade; });
    wallIdx.forEach((j, k) => { const p = pts[rim(j)]; const ok = place(H, p[0], p[1], tmp) >= 0; for (let h = 0; h < 2; h++) { const o = ((ti*WS+k)*2+h)*3; wp[o] = tmp[0]; wp[o+1] = ok ? h*1.3 : -50; wp[o+2] = tmp[1]; wc[o] = 0.30+h*0.25; wc[o+1] = 0.31+h*0.25; wc[o+2] = 0.48+h*0.25; } });
    doorIdx.forEach((j, k) => { for (let h = 0; h < 2; h++) { const p = pts[rim((j+h)%NB)]; const ok = place(H, p[0], p[1], tmp) >= 0; const o = ((ti*DS+k)*2+h)*3; dp[o] = tmp[0]; dp[o+1] = ok ? 0.01 : -50; dp[o+2] = tmp[1]; dc[o] = 1; dc[o+1] = 0.81; dc[o+2] = 0.29; } });
    const okc = place(H, C0[0], C0[1], tmp) >= 0; M4.makeTranslation(tmp[0], okc ? 0 : -50, tmp[1]); pillars.setMatrixAt(ti, M4); pillars.setColorAt(ti, t.col);
  });
  for (let ti = vis.length; ti < MAXT; ti++) { M4.makeTranslation(0, -99, 0); pillars.setMatrixAt(ti, M4); }
  pillars.count = MAXT; pillars.instanceMatrix.needsUpdate = true; if (pillars.instanceColor) pillars.instanceColor.needsUpdate = true;
  for (const g of [floorGeo, wallGeo, doorGeo]) { g.attributes.position.needsUpdate = true; g.attributes.color.needsUpdate = true; g.computeBoundingSphere(); }
  floorGeo.computeVertexNormals(); wallGeo.computeVertexNormals();
}

// ---------- HUD ----------
const $ = id => document.getElementById(id);
function hud(){
  $('addr').textContent = key(W.M); $('cross').textContent = W.cross.toLocaleString('en-US');
  const dg = Math.max(...W.M.flat().map(x => (x < 0n ? -x : x).toString().length)); $('digits').textContent = `${dg} digit${dg > 1 ? 's' : ''}`;
  const el = $('err'); el.textContent = !isFinite(lastErr) ? 'broken (NaN)' : lastErr === 0 ? 'exact so far' : lastErr < 1e-6 ? lastErr.toExponential(1) : `${lastErr.toFixed(2)}, rooms misplaced`;
  el.className = lastErr > 1e-6 || !isFinite(lastErr) ? 'bad' : '';
}
$('naive').onclick = e => { naive = !naive; e.target.classList.toggle('on', naive); e.target.textContent = naive ? 'Show exact engine' : 'Show float engine'; visKey = ''; };
$('far').onclick = () => { for (let i = 0; i < 5; i++) { const e = (W.out + i) % 2 ? 'T' : 'Q'; W.M = mul(W.M, GEN[e]); W.cross++; } W.out += 5; visKey = ''; $('msg').textContent = `${W.out} rooms out. The float engine holds until about 37, then rooms jump and vanish.`; };
$('reset').onclick = () => { W.M = I2; W.g = start(); W.cross = 0; W.out = 0; visKey = ''; $('msg').textContent = ''; };
$('vr').onclick = async () => {
  try { if (!navigator.xr || !(await navigator.xr.isSessionSupported('immersive-vr'))) throw 0;
    const s = await navigator.xr.requestSession('immersive-vr', {optionalFeatures:['local-floor']}); await renderer.xr.setSession(s); }
  catch (e) { $('msg').textContent = 'VR is not available in this view. Open the HTML file directly in a headset browser.'; }
};

// ---------- input ----------
const keys = new Set(); addEventListener('keydown', e => keys.add(e.key.toLowerCase())); addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
let drag = null, pitch = 0; const pads = {L:null, R:null};
canvas.addEventListener('pointerdown', e => { drag = {x:e.clientX, y:e.clientY}; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => { if (!drag) return; turn(-(e.clientX-drag.x)*0.005); pitch = Math.max(-1.2, Math.min(1.2, pitch-(e.clientY-drag.y)*0.004)); drag = {x:e.clientX, y:e.clientY}; });
canvas.addEventListener('pointerup', () => { drag = null; });
for (const side of ['L','R']) { const el = $('pad'+side);
  el.addEventListener('pointerdown', e => { el.setPointerCapture(e.pointerId); pads[side] = {x0:e.clientX, y0:e.clientY, x:e.clientX, y:e.clientY}; });
  el.addEventListener('pointermove', e => { if (pads[side]) { pads[side].x = e.clientX; pads[side].y = e.clientY; } });
  el.addEventListener('pointerup', () => { pads[side] = null; }); }

function resize(){ const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); cam.aspect = w/h; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
let last = performance.now(), hudT = 0;
renderer.setAnimationLoop(now => {
  const dt = Math.min(0.05, (now-last)/1000); last = now; const sp = 0.65*dt;
  let f = 0, st = 0;
  if (keys.has('w') || keys.has('arrowup')) f += 1; if (keys.has('s') || keys.has('arrowdown')) f -= 1;
  if (keys.has('a')) st += 1; if (keys.has('d')) st -= 1;
  if (keys.has('q') || keys.has('arrowleft')) turn(1.6*dt); if (keys.has('e') || keys.has('arrowright')) turn(-1.6*dt);
  if (pads.L) { f -= (pads.L.y-pads.L.y0)/50; st -= (pads.L.x-pads.L.x0)/50; }
  if (pads.R) turn(-(pads.R.x-pads.R.x0)/50*1.6*dt);
  let yaw = 0;
  const s = renderer.xr.getSession();
  if (s) { const xc = renderer.xr.getCamera(cam); const e = new THREE.Euler().setFromQuaternion(xc.quaternion, 'YXZ'); yaw = e.y;
    for (const src of s.inputSources) { const a = src.gamepad && src.gamepad.axes; if (!a || a.length < 4) continue;
      if (src.handedness === 'left') { f -= a[3]; st -= a[2]; } else if (Math.abs(a[2]) > 0.5) turn(-Math.sign(a[2])*1.6*dt); } }
  else cam.rotation.set(pitch, 0, 0, 'YXZ');
  const mag = Math.min(1, Math.hypot(f, st)); if (mag > 0.05) move(sp*mag, yaw + Math.atan2(st, f));
  rebuild(); renderer.render(scene, cam);
  if ((hudT += dt) > 0.2) { hudT = 0; hud(); }
});
}
</script>
